<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Listening | Rezhwan Majid (Grade 10-A)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #020408;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0f7fa;
            user-select: none;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #071324 0%, #010205 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hud-top {
            position: absolute;
            top: 22px;
            left: 28px;
            z-index: 40;
            background: rgba(3, 10, 22, 0.78);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-left: 4px solid #00e5ff;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 2px;
            color: #00e5ff;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide img {
            max-width: 94vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.28), 0 0 20px rgba(255, 193, 7, 0.18);
            border: 1px solid rgba(0, 229, 255, 0.35);
            filter: contrast(1.08) saturate(1.18) brightness(1.03);
            transform: scale(0.96);
        }

        .slide.active img {
            animation: hdrFloatZoom 12s ease-in-out infinite alternate;
        }

        @keyframes hdrFloatZoom {
            0% { transform: scale(0.97) translateY(0px); }
            100% { transform: scale(1.04) translateY(-6px); }
        }

        .controls {
            position: absolute;
            bottom: 26px;
            right: 30px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background: rgba(4, 14, 28, 0.88);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.55);
            padding: 10px 22px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.18);
        }

        .btn:hover {
            background: #00e5ff;
            color: #020408;
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.7);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .counter {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 50;
            font-family: monospace;
            font-size: 13px;
            color: #cbd5e1;
            background: rgba(4, 14, 28, 0.8);
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #00e5ff, #fbbf24);
            box-shadow: 0 0 12px #00e5ff;
            transition: width 0.5s ease;
            z-index: 60;
        }
    </style>
</head>

        <div class="counter" id="slideCounter">SLIDE 01 / 04</div>

        <div class="controls">
            <button class="btn" id="prevBtn" onclick="prevSlide()">&#9664; PREV</button>
            <button class="btn" id="nextBtn" onclick="nextSlide()">NEXT &#9654;</button>
        </div>

        <div class="progress-bar" id="progressBar" style="width: 25%;"></div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        function updateSlider() {
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });
            counter.textContent = `SLIDE 0${currentSlide + 1} / 0${slides.length}`;
            progressBar.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlider();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlider();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
    </script>

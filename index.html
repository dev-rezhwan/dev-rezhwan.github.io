<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveListening.exe | Rezhwan Majid (Grade 10-A)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #02040a; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        .cyber-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Image Slides (Fixed Size Issue) */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: contain; /* گۆڕدرا بۆ contain بۆ ئەوەی وێنەکە نەبڕدرێت */
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .slide.active { 
            opacity: 1; 
        }
        
        /* Smooth Zoom In Effect Applied ONLY to the active image */
        .slide.active .bg-img {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            animation: slowZoom 15s linear infinite alternate;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); } /* تەنیا کەمێک گەورە دەبێت */
        }

        .hud-top-left {
            position: absolute;
            top: 25px; left: 30px;
            color: #00f3ff;
            font-size: 13px;
            letter-spacing: 3px;
            z-index: 40;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            background: rgba(2, 4, 10, 0.85);
            padding: 10px 18px;
            border-radius: 6px;
            border-left: 4px solid #00f3ff;
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            border-right: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }

        .hud-bottom-right {
            position: absolute;
            bottom: 25px; right: 30px;
            color: #a5b4fc;
            font-size: 12px;
            z-index: 40;
            background: rgba(2, 4, 10, 0.85);
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }

        .qr-hologram {
            position: absolute;
            bottom: 80px; left: 30px;
            background: rgba(2, 4, 10, 0.9);
            border: 1px solid #00f3ff;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            z-index: 40;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            display: none;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .qr-hologram.show { display: block; }
        .qr-hologram img { width: 100px; height: 100px; display: block; border-radius: 4px; border: 1px solid #fff; }
        .qr-hologram span { color: #00f3ff; font-size: 11px; margin-top: 8px; display: block; letter-spacing: 2px; font-weight: bold; }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.7) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .energy-line {
            position: absolute;
            bottom: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f3ff, #10b981);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px #00f3ff;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="cyber-frame">
        <div class="hud-top-left">SYS_CORE // REZHWAN MAJID [GRADE 10-A]</div>
        
        <!-- وێنە لۆکاڵییەکان بە تەواوی دیارن بێ تێکچوون -->
        <div class="slide active"><div class="bg-img" style="background-image: url('1.jpg');"></div></div>
        <div class="slide"><div class="bg-img" style="background-image: url('2.jpg');"></div></div>
        <div class="slide"><div class="bg-img" style="background-image: url('3.jpg');"></div></div>
        <div class="slide"><div class="bg-img" style="background-image: url('4.jpg');"></div></div>

        <div class="qr-hologram" id="qrContainer">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://dev-rezhwan.github.io" alt="Live QR">
            <span>LIVE SCAN LINK</span>
        </div>

        <div class="hud-bottom-right" id="slideCounter">STATUS: NODE 01/04 [PRESS SPACE]</div>
        <div class="energy-line" id="progressBar" style="width: 25%;"></div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');
        const qrContainer = document.getElementById('qrContainer');

        function updateSlider() {
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });

            counter.textContent = `STATUS: NODE 0${currentSlide + 1}/04 [PRESS SPACE]`;
            progressBar.style.width = `${((currentSlide + 1) / 4) * 100}%`;

            if (currentSlide === 3) {
                qrContainer.classList.add('show');
            } else {
                qrContainer.classList.remove('show');
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlider();
            } else {
                currentSlide = 0;
                updateSlider();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            }
        });

        document.body.addEventListener('click', nextSlide);
    </script>
</body>
</html>

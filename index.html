<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Listening | Rezhwan Majid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .slide.active { opacity: 1; }

        .progress-dots {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .dot.active {
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <!-- دڵنیابەرەوە کە ناوەکانیان 1.jpg, 2.jpg, 3.jpg, 4.jpg ە -->
    <div class="slide active" style="background-image: url('1.jpg');"></div>
    <div class="slide" style="background-image: url('2.jpg');"></div>
    <div class="slide" style="background-image: url('3.jpg');"></div>
    <div class="slide" style="background-image: url('4.jpg');"></div>

    <div class="progress-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function updateSlider() {
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
                dots[index].classList.toggle('active', index === currentSlide);
            });
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlider();
            } else {
                currentSlide = 0;
                updateSlider();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
        });

        document.body.addEventListener('click', nextSlide);
    </script>
</body>
</html>

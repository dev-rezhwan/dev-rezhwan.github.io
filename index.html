<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Listening | Rezhwan Majid (Grade 10-A)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .slide.active { opacity: 1; }

        .slide img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25);
        }

        .hud-header {
            position: absolute;
            top: 20px; left: 25px;
            color: #00f3ff;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 12px;
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 4px;
        }

        .hud-footer {
            position: absolute;
            bottom: 20px; right: 25px;
            color: #a5b4fc;
            font-family: monospace;
            font-size: 13px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .qr-box {
            position: absolute;
            bottom: 70px; left: 25px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00f3ff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            z-index: 50;
            display: none;
        }
        .qr-box.show { display: block; }
        .qr-box img { width: 85px; height: 85px; display: block; box-shadow: none; max-width: none; max-height: none; }
        .qr-box span { color: #00f3ff; font-family: monospace; font-size: 10px; margin-top: 4px; display: block; }
    </style>
</head>
<body>

    <div class="hud-header">SYS_CORE // REZHWAN MAJID [GRADE 10-A]</div>

    <!-- ٤ وێنە ڕەسەنەکە بە کوالێتی بەرز -->
    <div class="slide active"><img src="1.jpg" alt="Slide 1"></div>
    <div class="slide"><img src="2.jpg" alt="Slide 2"></div>
    <div class="slide"><img src="3.jpg" alt="Slide 3"></div>
    <div class="slide"><img src="4.jpg" alt="Slide 4"></div>

    <div class="qr-box" id="qrContainer">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://dev-rezhwan.github.io" alt="QR">
        <span>LIVE SCAN</span>
    </div>

    <div class="hud-footer" id="slideCounter">NODE 01/04 [PRESS SPACE]</div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('slideCounter');
        const qrContainer = document.getElementById('qrContainer');

        function updateSlider() {
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });
            counter.textContent = `NODE 0${currentSlide + 1}/04 [PRESS SPACE]`;

            if (currentSlide === 3) {
                qrContainer.classList.add('show');
            } else {
                qrContainer.classList.remove('show');
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlider();
            } else {
                currentSlide = 0;
                updateSlider();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
        });

        document.body.addEventListener('click', nextSlide);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveListening.exe | Rezhwan Majid (Grade 10-A)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #02040a; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Holographic Container with Cyber Glow */
        .cyber-frame {
            position: relative;
            width: 95vw;
            height: 94vh;
            border: 2px solid rgba(0, 243, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.25), inset 0 0 30px rgba(0, 243, 255, 0.1);
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Scanline Effect for Cyberpunk Vibe */
        .cyber-frame::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 30;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Advanced Dynamic Zoom & Pan Animation */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transform: scale(1.15) rotate(0deg);
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: contrast(1.1) brightness(0.95);
        }
        
        .slide.active { 
            opacity: 1; 
            transform: scale(1) rotate(0deg);
            animation: subtlePulse 8s infinite alternate ease-in-out;
        }

        @keyframes subtlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        /* HUD Military / Hacker Overlays */
        .hud-top-left {
            position: absolute;
            top: 25px; left: 30px;
            color: #00f3ff;
            font-size: 13px;
            letter-spacing: 3px;
            z-index: 40;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            background: rgba(2, 4, 10, 0.85);
            padding: 10px 18px;
            border-radius: 6px;
            border-left: 4px solid #00f3ff;
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            border-right: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }

        .hud-bottom-right {
            position: absolute;
            bottom: 25px; right: 30px;
            color: #a5b4fc;
            font-size: 12px;
            z-index: 40;
            background: rgba(2, 4, 10, 0.85);
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }

        /* Live QR Code Box with Pulse Effect */
        .qr-hologram {
            position: absolute;
            bottom: 80px; left: 30px;
            background: rgba(2, 4, 10, 0.9);
            border: 1px solid #00f3ff;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            z-index: 40;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            display: none;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .qr-hologram.show { display: block; }
        .qr-hologram img { width: 100px; height: 100px; display: block; border-radius: 4px; border: 1px solid #fff; }
        .qr-hologram span { color: #00f3ff; font-size: 11px; margin-top: 8px; display: block; letter-spacing: 2px; font-weight: bold; }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.7) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Neon Progress Line */
        .energy-line {
            position: absolute;
            bottom: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f3ff, #10b981);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px #00f3ff;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="cyber-frame">
        <div class="hud-top-left">SYS_CORE // REZHWAN MAJID [GRADE 10-A]</div>
        
        <!-- وێنە پڕۆفیشناڵەکان بە تیشکی ئۆنلاین -->
        <div class="slide active" style="background-image: url('https://image.pollinations.ai/prompt/A%203D%20glowing%20cybernetic%20human%20ear%20capturing%20digital%20soundwaves,%20glowing%20neon%20cyan%20and%20gold%20theme,%20dark%20background');"></div>
        <div class="slide" style="background-image: url('https://image.pollinations.ai/prompt/A%203D%20glowing%20human%20brain%20processing%20digital%20data%20particles,%20glowing%20neon%20cyan%20and%20gold%20cybernetic%20theme,%20dark%20background');"></div>
        <div class="slide" style="background-image: url('https://image.pollinations.ai/prompt/A%20futuristic%20holographic%20magnifying%20glass%20scanning%20digital%20soundwaves,%20glowing%20neon%20cyan%20and%20gold%20cybernetic%20theme');"></div>
        <div class="slide" style="background-image: url('https://image.pollinations.ai/prompt/Two%20glowing%20abstract%20human%20profiles%20facing%20each%20other%20connected%20by%20a%20bright%20digital%20light%20beam,%20glowing%20neon%20cyan%20and%20gold%20cybernetic%20theme');"></div>

        <!-- QR Code بۆ سکان کردن لە کۆتا سلایددا -->
        <div class="qr-hologram" id="qrContainer">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://dev-rezhwan.github.io" alt="Live QR">
            <span>LIVE SCAN LINK</span>
        </div>

        <div class="hud-bottom-right" id="slideCounter">STATUS: NODE 01/04 [PRESS SPACE]</div>
        <div class="energy-line" id="progressBar" style="width: 25%;"></div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');
        const qrContainer = document.getElementById('qrContainer');

        function updateSlider() {
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });

            counter.textContent = `STATUS: NODE 0${currentSlide + 1}/04 [PRESS SPACE]`;
            progressBar.style.width = `${((currentSlide + 1) / 4) * 100}%`;

            if (currentSlide === 3) {
                qrContainer.classList.add('show');
            } else {
                qrContainer.classList.remove('show');
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlider();
            } else {
                currentSlide = 0;
                updateSlider();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            }
        });

        document.body.addEventListener('click', nextSlide);
    </script>
</body>
</html>
